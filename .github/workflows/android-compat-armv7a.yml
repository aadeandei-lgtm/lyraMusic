name: Android compat armv7a (minSdk 21, v1+v2+v3)

# Build varian KOMPATIBEL untuk head unit lama:
#  - minSdk diturunkan (default 21 = Android 5.0)
#  - APK di-sign ulang dengan RELEASE key memakai v1 (JAR) + v2 + v3,
#    karena Android 6 ke bawah HANYA mengenal v1.
# Workflow lain tidak diubah; hasil hanya artifact.

on:
  workflow_dispatch:
    inputs:
      min_sdk:
        description: "minSdk override (21-23)"
        required: false
        default: "21"

permissions:
  contents: read

jobs:
  build-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SIGNING_STORE_FILE: lyra-release.keystore
      SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "secret RELEASE_KEYSTORE_BASE64 kosong -> batal"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "app/$SIGNING_STORE_FILE"
          test -s "app/$SIGNING_STORE_FILE"
          keytool -list -keystore "app/$SIGNING_STORE_FILE" \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null
          echo "keystore release OK (alias: $SIGNING_KEY_ALIAS)"

      - name: Turunkan minSdk
        run: |
          sed -i "s/^\( *\)minSdk = 24$/\1minSdk = ${{ inputs.min_sdk }}/" app/build.gradle.kts
          grep -n "minSdk" app/build.gradle.kts
          grep -q "minSdk = ${{ inputs.min_sdk }}" app/build.gradle.kts || { echo "sed GAGAL"; exit 1; }

      - name: Build armv7a release
        run: bash ./gradlew :app:assembleRelease -ParmV7aOnly --no-configuration-cache --stacktrace
        env:
          LYRA_BOT_TOKEN: ${{ secrets.LYRA_BOT_TOKEN }}

      - name: Sign ulang dengan v1+v2+v3 (release key)
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK: $APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "app/$SIGNING_STORE_FILE" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/signed.apk "$APK"
          mv /tmp/signed.apk "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/verify.txt \
            || { echo "GAGAL: v1 signature tidak ada"; exit 1; }

      - name: Info APK, zipalign, checksum
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "sdkVersion|native-code|package:" || true
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tail -2 || true
          cp "$APK" LyraMusic-compat-armv7a-release.apk
          sha256sum LyraMusic-compat-armv7a-release.apk > LyraMusic-compat-armv7a-release.apk.sha256
          cat LyraMusic-compat-armv7a-release.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyraMusic-compat-armv7a
          path: |
            LyraMusic-compat-armv7a-release.apk
            LyraMusic-compat-armv7a-release.apk.sha256
          if-no-files-found: error
          retention-days: 90
