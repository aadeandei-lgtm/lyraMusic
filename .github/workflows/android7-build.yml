name: Android 7 Test Build (armv7-a)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK (universal, includes armeabi-v7a)
        run: bash ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Check APK ABIs and minSdk
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "sdkVersion|native-code|package:" || true
          cp "$APK" LyraMusic-android7-debug-universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyraMusic-android7-debug
          path: LyraMusic-android7-debug-universal.apk
          if-no-files-found: error
